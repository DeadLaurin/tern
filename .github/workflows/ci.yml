name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test (race, Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./...

  cross-build:
    name: Cross-compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect main package
        id: main
        shell: bash
        run: |
          pkg="$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d' | head -n 1)"
          if [ -z "$pkg" ]; then
            echo "::error::no main package found to build"
            exit 1
          fi
          echo "package=$pkg" >> "$GITHUB_OUTPUT"

      - name: Build all release targets
        shell: bash
        env:
          PACKAGE: ${{ steps.main.outputs.package }}
        run: |
          set -euo pipefail
          out_dir="$(mktemp -d)"
          trap 'rm -rf "$out_dir"' EXIT

          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            binary="tern"
            if [ "$goos" = "windows" ]; then
              binary="tern.exe"
            fi

            echo "Building ${PACKAGE} for ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "${out_dir}/${binary}" "$PACKAGE"
          done

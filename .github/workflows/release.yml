name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect main package
        id: main
        shell: bash
        run: |
          pkg="$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d' | head -n 1)"
          if [ -z "$pkg" ]; then
            echo "::error::no main package found to build"
            exit 1
          fi
          echo "package=$pkg" >> "$GITHUB_OUTPUT"

      - name: Build binaries and packages
        shell: bash
        env:
          PACKAGE: ${{ steps.main.outputs.package }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "::error::could not derive version from tag '${REF_NAME}'"
            exit 1
          fi

          dist="${GITHUB_WORKSPACE}/dist"
          rm -rf "$dist"
          mkdir -p "$dist"

          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            binary="tern"
            if [ "$goos" = "windows" ]; then
              binary="tern.exe"
            fi

            stage="$(mktemp -d)"
            echo "Building ${PACKAGE} for ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build \
                -trimpath \
                -ldflags="-s -w -X main.version=${REF_NAME}" \
                -o "${stage}/${binary}" \
                "$PACKAGE"

            name="tern_${version}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip -q -9 "${dist}/${name}.zip" "$binary")
            else
              tar -czf "${dist}/${name}.tar.gz" -C "$stage" "$binary"
            fi

            rm -rf "$stage"
          done

          (cd "$dist" && sha256sum *.tar.gz *.zip > checksums.txt)
          echo "Release assets:"
          ls -l "$dist"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

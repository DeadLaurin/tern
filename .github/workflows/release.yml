name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "::error::release tag must start with v followed by a version number (got: '${tag}')"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test -race ./...

      - name: Build binaries and packages
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          dist="${GITHUB_WORKSPACE}/dist"
          rm -rf "$dist"
          mkdir -p "$dist"

          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            binary="tern"
            if [ "$goos" = "windows" ]; then
              binary="tern.exe"
            fi

            stage="$(mktemp -d)"
            echo "Building ./cmd/tern ${TAG} for ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build \
                -trimpath \
                -ldflags="-s -w -X main.version=${TAG}" \
                -o "${stage}/${binary}" \
                ./cmd/tern

            name="tern_${VERSION}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip -q -9 "${dist}/${name}.zip" "$binary")
            else
              tar -czf "${dist}/${name}.tar.gz" -C "$stage" "$binary"
            fi

            rm -rf "$stage"
          done

          (cd "$dist" && sha256sum *.tar.gz *.zip > checksums.txt)
          echo "Release assets:"
          ls -lh "$dist"

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          notes="${GITHUB_WORKSPACE}/dist/RELEASE_NOTES.md"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="${TAG}" '
              BEGIN { header = "## [" tag "]" }
              !capture && index($0, header) == 1 { capture = 1; next }
              capture && index($0, "## [") == 1 { exit }
              capture { print }
            ' CHANGELOG.md > "$notes"
          fi

          if [ -s "$notes" ]; then
            echo "Publishing release notes from CHANGELOG.md for ${TAG}"
            echo "body_path=${notes}" >> "$GITHUB_OUTPUT"
          else
            rm -f "$notes"
            echo "No CHANGELOG.md section for ${TAG}; falling back to generated release notes"
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
